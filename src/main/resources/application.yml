# Configuração comum a todos os ambientes. O que muda entre eles (banco, log de
# SQL) fica em application-dev.yml e application-prod.yml.
spring:
  application:
    name: audit-service

  # Sem SPRING_PROFILES_ACTIVE, sobe como desenvolvimento. O Docker Compose ativa o prod.
  profiles:
    default: dev

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
